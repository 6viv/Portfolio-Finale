<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page de contact du portfolio de Maxime Descourt, étudiant en BTS SIO. Formulaire de contact pour projets, questions ou collaborations.">
    <meta name="keywords" content="contact portfolio BTS SIO, étudiant informatique, contact développeur débutant">
    <meta name="author" content="Maxime Descourt">
    <meta name="robots" content="index, follow">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
    <h1>Contact</h1>
    <p>Une question ou un projet ? N'hésitez pas à me contacter</p>
</header>

<main class="contact-container">

    <section class="intro">
        <h2>Entrons en contact</h2>
        <p>Vous peuvez utiliser le formulaire ci-dessous pour me contacter.</p>
    </section>

    <section class="contact-form">

        <label>
            Nom et Prénom
            <input type="text" placeholder="Ex : Maxime Descourt">
        </label>

        <label>
            Adresse email
            <input type="email" placeholder="exemple@email.com">
        </label>

        <label>
            Numéro de téléphone
            <input type="text" placeholder="06 00 00 00 00">
        </label>

        <label>
            Motif de contact
            <select>
                <option>Sélectionnez un motif</option>
                <option>Projet professionnel</option>
                <option>Demande d'information</option>
                <option>Collaboration</option>
                <option>Autre</option>
            </select>
        </label>

        <label>
            Message
            <textarea placeholder="Rédigez votre message ici..."></textarea>
        </label>

        <button>Envoyer le message</button>
        <p id="confirmation" style="display:none; color: white; margin-top:15px;">Message envoyé avec succès !</p>


    </section>

    </main>

    <footer class="footer">
        <p><a href="../index.html">⬅ Retour à l'accueil</a></p>
        <p>© 2025 - Portfolio personnel</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
