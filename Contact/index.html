<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
    <h1>Contact</h1>
    <p>Une question ? Un projet ? Écrivez-moi</p>
</header>

<main class="contact-container">

    <section class="intro">
        <h2>Entrons en contact</h2>
        <p>Vous peuvez utiliser le formulaire ci-dessous pour me contacter. Je réponds dès que possible.</p>
    </section>

    <section class="contact-form">

        <label>
            Nom / Prénom
            <input type="text" placeholder="Ton nom">
        </label>

        <label>
            Adresse email
            <input type="email" placeholder="ton@email.com">
        </label>

        <label>
            Numéro de téléphone
            <input type="text" placeholder="06 00 00 00 00">
        </label>

        <label>
            Pourquoi me contacter ?
            <select>
                <option>Projet professionnel</option>
                <option>Question</option>
                <option>Collaboration</option>
                <option>Autre</option>
            </select>
        </label>

        <label>
            Ton message
            <textarea placeholder="Écris ton message ici..."></textarea>
        </label>

        <button>Envoyer le message</button>
        <p id="confirmation" style="display:none; color: rgb(255, 255, 255); margin-top:15px;">✔ Message envoyé avec succès !</p>


    </section>

    </main>

    <footer class="footer">
        <p><a href="../index.html">⬅ Retour à l'accueil</a></p>
        <p>© 2025 - Portfolio personnel</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
